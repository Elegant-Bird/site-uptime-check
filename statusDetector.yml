name: Website Uptime Check

on:
  schedule:
    # Runs every 15 minutes (GitHub's practical minimum for cron)
    - cron: '*/15 * * * *'
  # Allows you to run the check manually from the Actions tab
  workflow_dispatch:

jobs:
  check-sites:
    runs-on: ubuntu-latest
    strategy:
      # Ensures all sites are checked even if the first one fails
      fail-fast: false
      matrix:
        url:
          - ${{ secrets.BOOKSHELF_URL }}
          - ${{ secrets.BOWL_URL }}
          - ${{ secrets.HOME_ASSISTANT_URL }}
          - ${{ secrets.IMMICH_URL }}
          - ${{ secrets.MEMOS_URL }}

    steps:
      - name: Check HTTP status for ${{ matrix.url }}
        run: |
          # Follow redirects (-L), silent (-s), output only HTTP status code
          STATUS=$(curl -L -s -o /dev/null -w "%{http_code}" --max-time 15 "${{ matrix.url }}")
          echo "Checked ${{ matrix.url }} - Status: $STATUS"
          
          # Fail the step if status is not 200 (or adjust to allow 200-299)
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "::error::${{ matrix.url }} is DOWN! Returned HTTP $STATUS"
            exit 1
          fi
